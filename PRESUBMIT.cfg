[Hook Overrides]
cros_license_check=false
tab_check=false
blank_line_check=false
check_change_no_include_board_phase=false
long_line_check=false

[Hook Overrides Options]

[Hook Scripts]
# Skip check_zephyr_project_config and zephyr_check_compliance on
# checkouts that track FPMCU release branches 'cros/firmware-fpmcu-.*-release'
# These checkouts can be found at 'src/platform/release-firmware'.
check_zephyr_project_config = bash -c "git rev-parse --abbrev-ref @{u} | grep -q \"cros/firmware-fpmcu-.*-release\" || ../../platform/ec/util/check_zephyr_project_config.py -d --commit ${PRESUBMIT_COMMIT}"
zephyr_check_compliance = bash -c "git rev-parse --abbrev-ref @{u} | grep -q \"cros/firmware-fpmcu-.*-release\" || ../../platform/ec/util/zephyr_check_compliance.py ${PRESUBMIT_COMMIT}"
